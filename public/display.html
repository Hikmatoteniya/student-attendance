<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        /* 1. Ensure all cells have a white background so scrolling text doesn't show underneath them */
        .table th,
        .table td {
            background-color: #fff !important;
        }

        /* 2. Define minimum widths */
        #student-table-head th,
        #student-table-body th,
        #student-table-body td {
            min-width: 90px;
        }

        /* ----- LEFT SIDE STICKY COLUMNS ----- */

        /* Column 1: ID (Fixed to target 'th' instead of 'td') */
        #student-table-head th:nth-child(1),
        #student-table-body th:nth-child(1) {
            position: sticky;
            left: 0;
            z-index: 2;
        }

        /* Column 2: Full Name (wider) */
        #student-table-head th:nth-child(2),
        #student-table-body td:nth-child(2) {
            position: sticky;
            left: 90px;
            min-width: 180px;
            z-index: 2;
        }

        /* Column 3: Course */
        #student-table-head th:nth-child(3),
        #student-table-body td:nth-child(3) {
            position: sticky;
            left: 270px;
            z-index: 2;
            border-right: 2px solid #dee2e6;
        }

        /* ----- RIGHT SIDE STICKY COLUMNS ----- */

        /* Second to last Column: Present % */
        #student-table-head th:nth-last-child(2),
        #student-table-body td:nth-last-child(2) {
            position: sticky;
            right: 90px;
            z-index: 2;
            border-left: 2px solid #dee2e6;
        }

        /* Last Column: Absent % */
        #student-table-head th:nth-last-child(1),
        #student-table-body td:nth-last-child(1) {
            position: sticky;
            right: 0;
            z-index: 2;
        }
    </style>
</head>

<body>


    <button id="export-btn" class="btn btn-primary mb-3 mt-3"><svg xmlns="http://www.w3.org/2000/svg" height="24px"
            viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
            <path
                d="M440-320v-326L336-542l-56-58 200-200 200 200-56 58-104-104v326h-80ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z" />
        </svg></button>


    <div class="table-responsive" style="max-width: 100%; overflow-x: auto; white-space: nowrap;">
        <table class="table table-bordered">
            <thead id="student-table-head">
            </thead>
            <tbody id="student-table-body">
            </tbody>
        </table>
    </div>

    <script type="module" src="display.js"></script>
</body>

</html>
