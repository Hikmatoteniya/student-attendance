<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <style>
    label {
      color: #1C221F;
    }

    /* input {
            width: 00px;
        } */
  </style>
</head>

<body>
  <div class="container mt-5 pt-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 login-box">

        <h4 class="text-center mb-4">Please Sign in here</h4>

        <div class="row mb-3">
          <label for="userId" class="col-sm-3 col-form-label">ID</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" id="userId" placeholder="Enter your ID">
            <span id="displayErrorId" style="font-size: 12px; color: red;"></span>
          </div>
        </div>

        <div class="row mb-4">
          <label for="inputPassword3" class="col-sm-3 col-form-label">Password</label>
          <div class="col-sm-9">
            <div class="input-group">
              <input type="password" class="form-control" id="inputPassword3" placeholder="Enter your password">
              <button class="btn border" type="button" id="toggleBtn" onclick="togglePassword()">Show</button>
            </div>
            <span id="displayErrorPassword" style="font-size: 12px; color: red;"></span>
          </div>
        </div>

        <div class="row">

          <div class="col-sm-9 offset-sm-3">
            <button onclick="goToAdmin()" id="adminBtn" class="btn btn-dark w-100">Sign in</button>
          </div>
          <div><a href="display.html">Go to attendance page</a></div>
        </div>

      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>

</html>
